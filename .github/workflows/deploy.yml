name: Deploy to Cloud Run

# Runs after a pull request is merged to main. It does nothing until the
# Google Cloud repository variables in docs/deploy-gcp.md are set.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove who it is to Google, so no key file is stored

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION || 'us-west1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'signal-edge-site' }}
    steps:
      - uses: actions/checkout@v4

      # Public build settings for the browser (safe to expose). Next.js reads this file at build time.
      - name: Write public build settings
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          } > .env.production

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Builds the Dockerfile in Cloud Build and rolls out a new Cloud Run revision.
      # --no-invoker-iam-check makes the site public. The signal-edge.ai organization blocks
      # the usual "allUsers" grant (--allow-unauthenticated), so that route returns 403 Forbidden.
      # Email sending switches on only once the SMTP_USER variable is set and the smtp-password
      # secret exists in Secret Manager (see docs/site-emails.md). The password never touches GitHub.
      # Clear Signal sending switches on only once CLEAR_SIGNAL_SENDING is "on" and its two secrets
      # exist (see docs/clear-signal-sending.md). Neither secret ever touches GitHub.
      # Card billing switches on only once STRIPE_BILLING is "on" and the Stripe key, the webhook
      # signing secret and the Supabase service role exist (see docs/stripe-billing.md).
      - name: Deploy
        env:
          SMTP_USER: ${{ vars.SMTP_USER }}
          CLEAR_SIGNAL_SENDING: ${{ vars.CLEAR_SIGNAL_SENDING }}
          STRIPE_BILLING: ${{ vars.STRIPE_BILLING }}
        run: |
          SECRETS=()
          ENV_ARGS=()
          if [ -n "$SMTP_USER" ]; then
            ENV_ARGS=(--update-env-vars "SMTP_USER=$SMTP_USER")
            SECRETS+=("SMTP_PASSWORD=smtp-password:latest")
            if [ "$CLEAR_SIGNAL_SENDING" = "on" ]; then
              SECRETS+=("SUPABASE_SERVICE_ROLE_KEY=supabase-service-role:latest" "CLEAR_SIGNAL_SEND_KEY=clear-signal-send-key:latest")
            fi
          fi
          if [ "$STRIPE_BILLING" = "on" ]; then
            SECRETS+=("STRIPE_SECRET_KEY=stripe-secret-key:latest" "STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest")
            if [[ ! " ${SECRETS[*]} " =~ SUPABASE_SERVICE_ROLE_KEY= ]]; then
              SECRETS+=("SUPABASE_SERVICE_ROLE_KEY=supabase-service-role:latest")
            fi
          fi
          SECRET_ARGS=()
          if [ ${#SECRETS[@]} -gt 0 ]; then
            SECRET_ARGS=(--update-secrets "$(IFS=,; echo "${SECRETS[*]}")")
          fi
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --source . \
            --no-invoker-iam-check \
            --port 8080 \
            --min-instances 0 \
            --max-instances 3 \
            "${ENV_ARGS[@]}" \
            "${SECRET_ARGS[@]}" \
            --quiet

      - name: Show the address
        run: |
          gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --format='value(status.url)'

      # Sends any Clear Signal issue that's due: a test copy to Tony, or the real issue to every subscriber.
      # Safe to run on every deploy, because the site skips anyone who already got that issue.
      - name: Send due Clear Signal emails
        if: ${{ vars.CLEAR_SIGNAL_SENDING == 'on' && vars.SMTP_USER != '' }}
        run: |
          KEY=$(gcloud secrets versions access latest --secret=clear-signal-send-key --project "${{ vars.GCP_PROJECT_ID }}")
          echo "::add-mask::$KEY"
          URL=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" --format='value(status.url)')
          for ROUND in $(seq 1 20); do
            RES=$(curl -sS --fail-with-body --max-time 290 -X POST "$URL/api/clear-signal/send" -H "Authorization: Bearer $KEY") || { echo "$RES"; exit 1; }
            echo "$RES"
            REMAINING=$(echo "$RES" | jq -r '.remaining')
            if [ "$REMAINING" = "0" ]; then exit 0; fi
          done
          echo "Clear Signal: $REMAINING emails still waiting after 20 rounds. Check the Cloud Run logs."
          exit 1
